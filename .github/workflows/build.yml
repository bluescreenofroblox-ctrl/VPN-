name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin

      - name: Create app structure
        run: |
          mkdir -p app/src/main/kotlin/com/example/vpnclient/vpn
          mkdir -p app/src/main/kotlin/com/example/vpnclient/util
          mv MainActivity.kt app/src/main/kotlin/com/example/vpnclient/ 2>/dev/null || true
          mv VpnService.kt app/src/main/kotlin/com/example/vpnclient/vpn/ 2>/dev/null || true
          mv VlessParser.kt app/src/main/kotlin/com/example/vpnclient/util/ 2>/dev/null || true
          mv AndroidManifest.xml app/src/main/ 2>/dev/null || true

      - name: Build with Gradle
        run: |
          apt-get update && apt-get install -y gradle
          gradle app:assembleDebug app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/**/*.apk
