name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin

      - name: Move files to correct structure
        run: |
          mkdir -p app/src/main/kotlin/com/example/vpnclient/vpn
          mkdir -p app/src/main/kotlin/com/example/vpnclient/util
          
          mv MainActivity.kt app/src/main/kotlin/com/example/vpnclient/
          mv VpnService.kt app/src/main/kotlin/com/example/vpnclient/vpn/
          mv VlessParser.kt app/src/main/kotlin/com/example/vpnclient/util/
          mv AndroidManifest.xml app/src/main/

      - name: Build APK
        run: ./gradlew assembleDebug assembleRelease

      - name: Upload APKs
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: APK-Build
          path: app/build/outputs/apk/**/*.apk
