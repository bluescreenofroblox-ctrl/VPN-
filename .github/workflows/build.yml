name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: 11
          distribution: temurin

      - name: Move files
        run: |
          mkdir -p app/src/main/kotlin/com/example/vpnclient/vpn
          mkdir -p app/src/main/kotlin/com/example/vpnclient/util
          
          [ -f MainActivity.kt ] && mv MainActivity.kt app/src/main/kotlin/com/example/vpnclient/
          [ -f VpnService.kt ] && mv VpnService.kt app/src/main/kotlin/com/example/vpnclient/vpn/
          [ -f VlessParser.kt ] && mv VlessParser.kt app/src/main/kotlin/com/example/vpnclient/util/
          [ -f AndroidManifest.xml ] && mv AndroidManifest.xml app/src/main/

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew app:assembleDebug app:assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: APK
          path: app/build/outputs/apk/**/*.apk
