name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: gradle

      - name: Setup directories
        run: |
          mkdir -p app/src/main/kotlin/com/example/vpnclient/vpn
          mkdir -p app/src/main/kotlin/com/example/vpnclient/util
          cp MainActivity.kt app/src/main/kotlin/com/example/vpnclient/ 2>/dev/null || true
          cp VpnService.kt app/src/main/kotlin/com/example/vpnclient/vpn/ 2>/dev/null || true
          cp VlessParser.kt app/src/main/kotlin/com/example/vpnclient/util/ 2>/dev/null || true
          cp AndroidManifest.xml app/src/main/ 2>/dev/null || true

      - name: Build APK
        run: gradle app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
